name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j4 all CC=${{ matrix.compiler }}
      - name: Check
        run: make check CC=${{ matrix.compiler }}
      - name: Test
        run: make test CC=${{ matrix.compiler }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make -j4 sanitize CC=gcc
